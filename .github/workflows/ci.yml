name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: cargo check (server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Check workspace (server targets)
        run: cargo check --workspace --all-targets

  wasm:
    name: cargo check (wasm hydrate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Check hydrate target
        run: cargo check -p instant-space-app --target wasm32-unknown-unknown --features hydrate

  test:
    name: cargo test (unit)
    runs-on: ubuntu-latest
    env:
      # Unit tests that touch the database are skipped when DATABASE_URL is
      # unset; pure-logic tests still run.
      DATABASE_URL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test workspace
        run: cargo test --workspace --lib --bins -- --skip ignored
