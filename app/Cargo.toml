[package]
name = "instant-space-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "instant_space_web"
crate-type = ["cdylib", "rlib"]

[features]
default = ["ssr"]
ssr = [
  "dep:instant-auth",
  "dep:instant-db",
  "dep:anyhow",
  "dep:axum",
  "dep:futures-util",
  "dep:leptos_axum",
  "dep:sqlx",
  "dep:time",
  "dep:tokio",
  "dep:tower-http",
  "dep:tower",
  "dep:tracing",
  "dep:tracing-subscriber",
  "leptos/ssr",
  "leptos_meta/ssr",
  "leptos_router/ssr",
]
hydrate = [
  "dep:console_error_panic_hook",
  "dep:js-sys",
  "dep:wasm-bindgen",
  "dep:wasm-bindgen-futures",
  "dep:web-sys",
  "dep:gloo-timers",
  "leptos/hydrate",
]

[dependencies]
instant-auth = { path = "../crates/auth", optional = true }
instant-db = { path = "../crates/db", optional = true }
instant-domain = { path = "../crates/domain" }
instant-map-ui = { path = "../crates/map-ui" }
anyhow = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
console_error_panic_hook = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
leptos = { workspace = true, default-features = false }
leptos_axum = { workspace = true, optional = true }
leptos_meta = { workspace = true, default-features = false }
leptos_router = { workspace = true, default-features = false }
serde.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, optional = true }
thiserror.workspace = true
time = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
uuid.workspace = true
url.workspace = true
js-sys = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
gloo-timers = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = ["Window", "EventTarget", "Navigator", "Geolocation", "Position", "Coordinates", "PositionError", "PositionOptions", "Location", "Blob", "File", "FileList", "FormData", "HtmlInputElement", "HtmlAnchorElement", "Request", "RequestInit", "RequestMode", "Response", "Url"] }
