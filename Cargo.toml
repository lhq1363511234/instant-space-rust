[workspace]
resolver = "2"
members = [
  "app",
  "crates/auth",
  "crates/db",
  "crates/domain",
  "crates/importer",
  "crates/map-ui",
]

[workspace.package]
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[workspace.dependencies]
anyhow = "1"
argon2 = "0.5"
axum = { version = "0.7", features = ["ws", "multipart"] }
console_error_panic_hook = "0.1"
futures-util = "0.3"
leptos = { version = "0.7", default-features = false }
leptos_axum = "0.7"
leptos_meta = { version = "0.7", default-features = false }
leptos_router = { version = "0.7", default-features = false }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "time", "json", "migrate"] }
thiserror = "1"
time = { version = "0.3", features = ["serde", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v5", "serde", "js"] }
url = "2"
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = "0.3"
wasm-bindgen-futures = "0.4"
gloo-timers = { version = "0.3", features = ["futures"] }
