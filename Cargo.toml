[workspace]
resolver = "2"
members = [
  "app",
  "crates/auth",
  "crates/db",
  "crates/domain",
  "crates/importer",
  "crates/map-ui",
]

[workspace.package]
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
anyhow = "1"
argon2 = "0.5"
axum = "0.7"
console_error_panic_hook = "0.1"
leptos = "0.7"
leptos_axum = "0.7"
leptos_meta = "0.7"
leptos_router = "0.7"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "time", "json", "migrate"] }
thiserror = "1"
time = { version = "0.3", features = ["serde", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
wasm-bindgen = "0.2"
web-sys = "0.3"
